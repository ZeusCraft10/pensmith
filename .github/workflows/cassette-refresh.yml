# .github/workflows/cassette-refresh.yml
#
# Weekly HTTP-cassette refresh for the source-adapter fixtures in
# tests/fixtures/cassettes/<adapter>/. `npm test` runs sources OFFLINE (the
# test-runner lane of D-V1-01: scripts/run-tests.mjs sets PENSMITH_TEST=1 and
# replays exact-match fixtures unless PENSMITH_NETWORK_TESTS=1), so recorded
# cassettes are the fast, hermetic path. This cron job is the SLOW lane that
# re-records them against the live APIs with `npm run cassettes:refresh`
# (scripts/refresh-cassettes.mjs, CI-07 / D-17-14) and opens a PR if anything
# drifted.
#
# Why a separate workflow:
#   - PR CI must remain hermetic + fast (no live HTTP from contributor PRs).
#   - Cassette refresh needs network + write access to a branch + PR creation
#     (peter-evans/create-pull-request@v6) — broader scope than ci.yml.
#
# JOB-LEVEL permissions (REQUIRED — repo-level defaults in this org are
# `contents: read` only; the peter-evans action needs `contents: write` AND
# `pull-requests: write` on the job to push the refresh branch and open a PR).
# This is the constraint surfaced by the user pre-Plan-09 — DO NOT remove.

name: Cassette Refresh

on:
  # Weekly: every Monday 06:00 UTC. Gives a 24h buffer before the working
  # week starts so maintainers can review the diff during business hours.
  schedule:
    - cron: '0 6 * * 1'
  # Manual dispatch for ad-hoc refreshes (e.g. when a Crossref schema change
  # breaks a fixture mid-week).
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # JOB-LEVEL permissions block — the peter-evans/create-pull-request@v6
    # action below requires BOTH contents:write (to push the refresh branch)
    # AND pull-requests:write (to open the PR). Repo-default `contents: read`
    # would silently fail to push and the action would 403 on PR open.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # CI-06 / D-17-39: every workflow other than the ci.yml matrix runs
          # on Node 24 (the newest supported LTS line).
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Re-record cassettes (live network — every source adapter)
        env:
          # Contact email is REQUIRED by the Crossref/OpenAlex polite-pool policy
          # (D-15 / RESEARCH §RQ-3) and by Unpaywall; the recorder fails fast
          # without it and redacts it from every stored fixture. Provided as a
          # repo secret so the cron identifies itself correctly to the APIs.
          PENSMITH_CONTACT_EMAIL: ${{ secrets.PENSMITH_CONTACT_EMAIL }}
        run: npm run cassettes:refresh

      - name: Validate the re-recorded cassettes (no leaked headers, ≤ 51200 bytes, provenance)
        run: node --import tsx --test tests/cassette-no-leak.test.ts tests/cassette-size.test.ts tests/cassette-provenance.test.ts

      - name: Create PR with refreshed cassettes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            chore(cassettes): weekly refresh

            Re-records tests/fixtures/cassettes/<adapter>/ against the
            live source APIs (npm run cassettes:refresh). Review the diff
            for unexpected schema drift before merging.
          branch: cassette-refresh-${{ github.run_id }}
          delete-branch: true
          title: 'chore(cassettes): weekly refresh'
          body: |
            Automated weekly cassette refresh. `npm test` replays recorded
            cassettes offline (the test-runner lane); this PR brings the
            recorded fixtures back in sync with the live APIs.

            **Review checklist:**
            - [ ] Diff is purely structural (cassette IDs, timestamps, schema-stable fields)
            - [ ] No PII or API tokens leaked into recorded headers
            - [ ] tests/cassette-no-leak passes (T-3-02 / T-01-07 sentinel scan)
            - [ ] Cassette byte-size remains ≤ 51200 per file (D-25)
          labels: |
            cassettes
            automated
