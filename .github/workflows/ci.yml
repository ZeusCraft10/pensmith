name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify macos runner is arm64
        if: matrix.os == 'macos-latest'
        run: |
          echo "runner.arch=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = "ARM64"
        shell: bash

      - run: npm ci

      # bin/lib/version.generated.ts is gitignored; lint and typecheck import it,
      # so generate it before either runs on a fresh checkout.
      - name: Generate derived sources
        run: npm run prebuild

      # plugin/dist is committed so a marketplace install needs no build. Fail if
      # it no longer matches the sources (fix: `npm run bundle` and commit).
      - name: Committed plugin bundle is up to date
        run: npm run bundle:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Test suite + coverage gate (non-TTY stdin)
        shell: bash
        run: npm run test:coverage < /dev/null

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # claude plugin validate (plugin and marketplace, --strict), an isolated
      # marketplace add + install that must show 1 skill and 1 hook, and
      # `pensmith --version` installed and through a symlink.
      - name: Plugin validate + isolated install smoke
        run: node scripts/plugin-smoke.mjs

      - name: Assert working tree is clean after build
        shell: bash
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "FAIL: the build produced untracked or modified files:"
            echo "$status"
            exit 1
          fi
          echo "OK: working tree is clean."
