name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # CI-06 / D-V1-06 / D-17-39: the supported Node LTS lines. engines.node
        # is >=22.12.0; Node 20 is EOL and is not tested.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify macos runner is arm64 (Pitfall C)
        if: matrix.os == 'macos-latest'
        run: |
          echo "runner.arch=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = "ARM64"
        shell: bash

      - run: npm ci

      # Generate the gitignored derived sources (bin/lib/version.generated.ts +
      # verbs.json) BEFORE lint/typecheck. They are produced by build's prebuild
      # hook, but lint + `tsc --noEmit` run before `npm run build` and import
      # version.generated.js — on a fresh checkout those files don't exist yet,
      # so typecheck fails with TS2307. (Local `npm run check` is green only
      # because the files persist on disk between builds.)
      - name: Generate derived sources (prebuild — version.generated.ts + verbs.json)
        run: npm run prebuild

      - run: npm run lint

      - run: npx tsc --noEmit

      - name: Build (produces dist/mcp/server.js for manifest validation)
        run: npm run build

      # PLUG-02 / D-23a-04: the committed plugin bundles (plugin/dist/) must be
      # exactly what `npm run bundle` makes from these sources — fails on any
      # modified, deleted or new file. Rebundle and commit after changing
      # bin/lib, mcp/ or hooks/.
      - name: Plugin bundles match their sources (bundle:check)
        run: npm run bundle:check

      # CI-09 / D-17-40: tests must never touch the real user data dir. Record a
      # fingerprint (every file + sha256, or "absent") of the REAL pensmith data
      # dir (LOCALAPPDATA / ~/Library/Application Support / XDG_DATA_HOME) before
      # any test runs; the step after the test suite asserts it is unchanged.
      - name: Fingerprint the real pensmith data dir (before tests — CI-09)
        id: data-dir-before
        shell: bash
        run: |
          node scripts/data-dir-fingerprint.mjs > "$RUNNER_TEMP/pensmith-data-before.txt"
          cat "$RUNNER_TEMP/pensmith-data-before.txt"

      - name: Tier contract (Tier 1 ↔ Tier 2 equivalence — D-23 layer 1)
        run: npm run test:tier-contract

      - name: Test suite + coverage gate (non-TTY stdin — CI-03)
        shell: bash
        run: npm run test:coverage < /dev/null

      # Runs even when a test step failed (a failing suite used to hide a leak:
      # the step was skipped), as long as the "before" fingerprint was taken.
      - name: Assert tests left the real pensmith data dir untouched (CI-09)
        if: ${{ !cancelled() && steps.data-dir-before.outcome == 'success' }}
        shell: bash
        run: |
          node scripts/data-dir-fingerprint.mjs > "$RUNNER_TEMP/pensmith-data-after.txt"
          if ! diff -u "$RUNNER_TEMP/pensmith-data-before.txt" "$RUNNER_TEMP/pensmith-data-after.txt"; then
            echo "FAIL: the test run changed the real pensmith data dir (CI-09). Tests must use the per-run temp data dir."
            exit 1
          fi
          echo "OK: real pensmith data dir unchanged."

      - name: Validate plugin manifests
        run: node scripts/validate-plugin-manifest.cjs

      - name: Assert working tree is clean after build (stale-derived-file guard — CI-02)
        shell: bash
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "FAIL: build/prebuild produced untracked or modified files:"
            echo "$status"
            exit 1
          fi
          echo "OK: working tree is clean."

  # CI-05 / D-23a-18: validate, install and launch the REAL plugin with a pinned
  # Claude Code on every change, with no API key (scripts/plugin-smoke.mjs):
  # `claude plugin validate --strict` on plugin/, its plugin.json and the
  # marketplace (plus the plugin-legacy negative control); marketplace add +
  # install + list + details from a fresh clone with no npm ci or build in an
  # isolated CLAUDE_CONFIG_DIR; `claude mcp list` connected; the installed
  # cache's server answering initialize + tools/list; and "not connected" with
  # no node on PATH. Maintainer item: make this job a required check in the
  # branch protection settings.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # >= 2.1.282, the version the 23a checks were made with. Pinned so a
      # Claude Code release cannot change the verdict without a commit here.
      CLAUDE_CODE_VERSION: 2.1.285
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The npm package installs the native claude binary on every OS (its
      # postinstall copies the platform package's executable into bin/); on
      # Windows npm adds a claude.cmd shim, which the smoke resolves to the
      # claude.exe behind it so the no-node check can run it by absolute path.
      - name: Install Claude Code ${{ env.CLAUDE_CODE_VERSION }} (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"

      - name: Claude Code version
        run: claude --version

      - name: Plugin smoke (CI-05)
        run: npm run plugin:smoke
