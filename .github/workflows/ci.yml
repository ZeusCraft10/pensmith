name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # CI-06 / D-V1-06 / D-17-39: the supported Node LTS lines. engines.node
        # is >=22.12.0; Node 20 is EOL and is not tested.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify macos runner is arm64 (Pitfall C)
        if: matrix.os == 'macos-latest'
        run: |
          echo "runner.arch=$RUNNER_ARCH"
          test "$RUNNER_ARCH" = "ARM64"
        shell: bash

      - run: npm ci

      # HARDEN-03 / D-20-09: the citation-integrity property test
      # (tests/citation-integrity.property.test.ts) and the citation-grammar
      # corpus check the one citation grammar against pandoc itself. With
      # CI=true a missing pandoc FAILS the property test, so every runner
      # installs the version the corpora were recorded with.
      - name: Install pandoc 3.9 (the HARDEN-03 citation oracle)
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.9'

      - name: Show the pandoc the property test runs against
        run: pandoc --version
        shell: bash

      # Generate the gitignored derived sources (bin/lib/version.generated.ts +
      # verbs.json) BEFORE lint/typecheck. They are produced by build's prebuild
      # hook, but lint + `tsc --noEmit` run before `npm run build` and import
      # version.generated.js — on a fresh checkout those files don't exist yet,
      # so typecheck fails with TS2307. (Local `npm run check` is green only
      # because the files persist on disk between builds.)
      - name: Generate derived sources (prebuild — version.generated.ts + verbs.json)
        run: npm run prebuild

      - run: npm run lint

      - run: npx tsc --noEmit

      - name: Build (produces dist/mcp/server.js for manifest validation)
        run: npm run build

      # CI-09 / D-17-40: tests must never touch the real user data dir. Record a
      # fingerprint (every file + sha256, or "absent") of the REAL pensmith data
      # dir (LOCALAPPDATA / ~/Library/Application Support / XDG_DATA_HOME) before
      # any test runs; the step after the test suite asserts it is unchanged.
      - name: Fingerprint the real pensmith data dir (before tests — CI-09)
        id: data-dir-before
        shell: bash
        run: |
          node scripts/data-dir-fingerprint.mjs > "$RUNNER_TEMP/pensmith-data-before.txt"
          cat "$RUNNER_TEMP/pensmith-data-before.txt"

      - name: Tier contract (Tier 1 ↔ Tier 2 equivalence — D-23 layer 1)
        run: npm run test:tier-contract

      - name: Test suite + coverage gate (non-TTY stdin — CI-03)
        shell: bash
        run: npm run test:coverage < /dev/null

      # Runs even when a test step failed (a failing suite used to hide a leak:
      # the step was skipped), as long as the "before" fingerprint was taken.
      - name: Assert tests left the real pensmith data dir untouched (CI-09)
        if: ${{ !cancelled() && steps.data-dir-before.outcome == 'success' }}
        shell: bash
        run: |
          node scripts/data-dir-fingerprint.mjs > "$RUNNER_TEMP/pensmith-data-after.txt"
          if ! diff -u "$RUNNER_TEMP/pensmith-data-before.txt" "$RUNNER_TEMP/pensmith-data-after.txt"; then
            echo "FAIL: the test run changed the real pensmith data dir (CI-09). Tests must use the per-run temp data dir."
            exit 1
          fi
          echo "OK: real pensmith data dir unchanged."

      - name: Validate plugin manifests
        run: node scripts/validate-plugin-manifest.cjs

      - name: Assert working tree is clean after build (stale-derived-file guard — CI-02)
        shell: bash
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "FAIL: build/prebuild produced untracked or modified files:"
            echo "$status"
            exit 1
          fi
          echo "OK: working tree is clean."
