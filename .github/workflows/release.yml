# .github/workflows/release.yml
#
# Publish a release. On a v* tag: check that the tag matches the versions in
# package.json and plugin.json, run every gate CI runs, then commit the built
# plugin/ payload as the next commit on the `release` branch. The marketplace
# entry (.claude-plugin/marketplace.json) installs the plugin from that branch.
# Its history is kept: the push is a plain fast-forward, never forced.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# One release at a time, so two tags cannot race for the release branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Tag matches package.json and plugin.json
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"

      - run: npm ci

      # prebuild, lint, typecheck, build, bundle (plugin/dist) and the tests.
      - name: Full check (non-TTY stdin)
        shell: bash
        run: npm run check < /dev/null

      # The exact version ci.yml pins.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.331

      # Validates plugin/ and the marketplace, then installs the release-shaped
      # tree from a throwaway local marketplace: 1 skill, 1 hook, no MCP.
      - name: Plugin validate + isolated install smoke
        run: node scripts/plugin-smoke.mjs

      - name: Publish the plugin payload to the release branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/release.mjs publish "$GITHUB_REF_NAME"

      - name: GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
